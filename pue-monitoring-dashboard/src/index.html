<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PUE Monitoring Dashboard</title><link rel="stylesheet" href="styles.css"></head><body>
<header><h1>PUE Monitoring Dashboard</h1><p>Power Usage Effectiveness — live simulated feed, target 1.40.</p></header>
<main>
<section class="card"><h2>Live PUE</h2><div id="live"></div><div id="alert"></div>
<label>Target PUE<input id="tgt" type="number" value="1.4" step="0.05" onchange="render()"></label>
<label>Tariff (Rs/kWh)<input id="tar" type="number" value="8" step="0.5" onchange="render()"></label>
<button class="sec" onclick="toggleFeed()" id="feedBtn">Pause live feed</button></section>
<section class="card"><h2>Overhead breakdown</h2><div id="brk"></div></section>
<section class="card full"><h2>PUE trend (last 60 readings)</h2><canvas id="chart" height="180"></canvas></section>
<section class="card"><h2>What-if: cut cooling power</h2>
<label><span id="wLab">Cooling reduction: 10%</span><input id="wif" type="range" min="0" max="30" value="10" oninput="render()"></label>
<div id="wifOut"></div></section>
<section class="card"><h2>Upload CSV</h2><p class="mut">CSV columns: timestamp,it_kw,cooling_kw,lighting_kw,losses_kw. A sample is in <code>assets/sample-pue.csv</code>.</p>
<input type="file" accept=".csv" onchange="loadCSV(event)"><div id="csvOut"></div></section>
</main><script src="app.js"></script></body></html>

<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<title>Solar Rooftop Estimator</title>
<style>body{font-family:system-ui,sans-serif;max-width:900px;margin:0 auto;padding:20px;background:#fffbeb;color:#0f172a}
.card{background:#fff;border:1px solid #fde68a;border-radius:10px;padding:16px;margin:14px 0}
label{display:block;font-size:13px;margin:8px 0 2px}input,select{padding:8px;width:220px;border:1px solid #d6d3d1;border-radius:6px}
button{background:#d97706;color:#fff;border:0;border-radius:6px;padding:10px 18px;cursor:pointer}
.big{font-size:26px;font-weight:700;color:#b45309}
canvas{width:100%;height:220px}</style></head>
<body><h1>☀️ Solar Rooftop Estimator</h1>
<p>Real irradiance from Open-Meteo for your location — with a city fallback table when offline.</p>
<div class="card">
<label>Roof area (m²)</label><input id="area" type="number" value="100">
<label>City</label><select id="city">
<option value="Noida|28.54|77.39|5.1">Noida</option><option value="Delhi|28.61|77.21|5.0">Delhi</option>
<option value="Mumbai|19.08|72.88|4.6">Mumbai</option><option value="Bengaluru|12.97|77.59|5.3">Bengaluru</option>
<option value="Chennai|13.08|80.27|5.4">Chennai</option><option value="Jaipur|26.91|75.79|5.5">Jaipur</option>
<option value="Lucknow|26.85|80.95|4.9">Lucknow</option><option value="Kolkata|22.57|88.36|4.5">Kolkata</option>
</select>
<label>Tilt (°)</label><input id="tilt" type="number" value="28">
<label>Orientation</label><select id="az"><option value="180">South</option><option value="135">South-East</option><option value="225">South-West</option><option value="90">East</option><option value="270">West</option></select>
<label>Tariff (₹/kWh)</label><input id="tariff" type="number" value="8">
<br><br><button onclick="estimate(true)">Estimate</button>
<span id="src" style="color:#78716c;font-size:13px"></span></div>
<div class="card" id="out"></div>
<div class="card"><h3>Monthly generation (kWh)</h3><canvas id="chart" width="800" height="220"></canvas></div>
<script>
const MONTH_DAYS=[31,28,31,30,31,30,31,31,30,31,30,31];
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
async function estimate(){
  const area=+document.getElementById('area').value, tariff=+document.getElementById('tariff').value,
    tilt=+document.getElementById('tilt').value, az=+document.getElementById('az').value;
  const [city,lat,lon,pshFb]=document.getElementById('city').value.split('|');
  let psh=+pshFb, src='city fallback table';
  try{
    const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&hourly=shortwave_radiation&forecast_days=7&timezone=auto');
    const j=await r.json();
    const vals=j.hourly.shortwave_radiation;
    psh=vals.reduce((a,b)=>a+b,0)/vals.length/1000*24/7*7/7; // mean W/m2 -> kWh/m2/day approx
    psh=vals.reduce((a,b)=>a+b,0)/1000/7; // total kWh/m2 over 7 days / 7
    src='Open-Meteo live irradiance';
  }catch(e){/* offline: keep fallback */}
  const panels=Math.floor(area*0.70/2.2), kwp=panels*0.55;
  const tf=Math.max(0.70,Math.pow(Math.cos(Math.abs(tilt-lat)*Math.PI/180),1.5));
  const of=Math.max(0.70,Math.pow(Math.cos((az-180)*Math.PI/180),0.8));
  const annual=kwp*psh*365*0.78*tf*of, cost=kwp*55000, saving=annual*tariff;
  document.getElementById('src').textContent='Irradiance source: '+src+' (PSH '+psh.toFixed(2)+' h/day)';
  document.getElementById('out').innerHTML=
   '<p><b>'+panels+' panels</b> × 550 W = <span class="big">'+kwp.toFixed(2)+' kWp</span> &nbsp;·&nbsp; usable roof '+(area*0.7).toFixed(0)+' m², layout ≈ '+Math.ceil(panels/2)+' rows</p>'+
   '<p>Generation: <b>'+Math.round(annual).toLocaleString('en-IN')+' kWh/year</b> (~'+Math.round(annual/12).toLocaleString('en-IN')+' kWh/month)</p>'+
   '<p>System cost ≈ ₹'+Math.round(cost).toLocaleString('en-IN')+' · saves ₹'+Math.round(saving).toLocaleString('en-IN')+'/year → <b>payback '+ (cost/saving).toFixed(1) +' years</b></p>'+
   '<p style="color:#78716c;font-size:13px">E = kWp × PSH × 365 × PR (0.78), tilt factor '+tf.toFixed(2)+', orientation factor '+of.toFixed(2)+'.</p>';
  // monthly chart: seasonal shape peaking Mar-May, dipping in monsoon
  const shape=[0.92,0.98,1.08,1.12,1.10,0.95,0.82,0.84,0.92,0.98,0.90,0.88];
  const monthly=shape.map((s,i)=>annual/12*s);
  const c=document.getElementById('chart'), ctx=c.getContext('2d'), mx=Math.max(...monthly);
  ctx.clearRect(0,0,c.width,c.height);
  monthly.forEach((v,i)=>{const h=v/mx*170; ctx.fillStyle='#f59e0b';
    ctx.fillRect(20+i*64,200-h,44,h); ctx.fillStyle='#0f172a'; ctx.font='12px sans-serif';
    ctx.fillText(MONTHS[i],24+i*64,216); ctx.fillText(Math.round(v),20+i*64,192-h);});
}
estimate();
</script></body></html>

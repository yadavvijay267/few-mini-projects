services:
  api:
    build: ./src/api
    ports: ["8000:8000"]
    environment: [DATABASE_URL=postgres://app:app@db:5432/app, REDIS_URL=redis://cache:6379]
    depends_on:
      db: {condition: service_healthy}
      cache: {condition: service_started}
    healthcheck: {test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"], interval: 10s, timeout: 3s, retries: 3}
    restart: unless-stopped
  worker:
    build: ./src/worker
    environment: [DATABASE_URL=postgres://app:app@db:5432/app, REDIS_URL=redis://cache:6379]
    depends_on: [api]
    restart: unless-stopped
  frontend:
    build: ./src/frontend
    ports: ["8080:80"]
  nginx:
    image: nginx:alpine
    ports: ["80:80"]
    volumes: ["./src/nginx/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [api, frontend]
    restart: unless-stopped
  db:
    image: postgres:16
    environment: [POSTGRES_USER=app, POSTGRES_PASSWORD=app, POSTGRES_DB=app]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U app"], interval: 5s, retries: 5}
    volumes: ["pgdata:/var/lib/postgresql/data"]
  cache:
    image: redis:7
volumes: {pgdata: {}}

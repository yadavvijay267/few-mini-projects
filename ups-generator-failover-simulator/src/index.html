<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<title>UPS &amp; Generator Failover Simulator</title>
<style>body{font-family:system-ui,sans-serif;max-width:960px;margin:0 auto;padding:20px;background:#f8fafc;color:#0f172a}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:16px;margin:14px 0}
label{display:block;font-size:13px;margin:8px 0 2px}input{padding:8px;width:200px;border:1px solid #cbd5e1;border-radius:6px}
button{background:#0f766e;color:#fff;border:0;border-radius:6px;padding:10px 18px;cursor:pointer}
table{border-collapse:collapse;width:100%}td,th{border:1px solid #e2e8f0;padding:6px;text-align:left;font-size:14px}
.gap{background:#fef2f2}.ok{background:#f0fdf4}
canvas{width:100%;height:200px}</style></head>
<body><h1>🔋 UPS &amp; Generator Failover Simulator</h1>
<p>Mains fails at t = 0. Watch the UPS carry the load, the generator start, and the ATS transfer — and find the gap.</p>
<div class="card">
<label>Load (kW)</label><input id="load" type="number" value="800">
<label>UPS rating (kVA)</label><input id="ups" type="number" value="1000">
<label>UPS runtime at full load (s)</label><input id="runtime" type="number" value="900">
<label>Generator rating (kVA)</label><input id="gen" type="number" value="900">
<label>Generator start delay (s)</label><input id="gstart" type="number" value="15">
<label>ATS delay after generator ready (s)</label><input id="ats" type="number" value="3">
<label>Mains restore (s)</label><input id="restore" type="number" value="300">
<br><br><button onclick="run()">▶ Run simulation</button></div>
<div class="card"><h3>Load vs capacity</h3><canvas id="chart" width="880" height="200"></canvas></div>
<div class="card" id="verdict"></div>
<div class="card"><h3>Timeline</h3><div id="timeline"></div></div>
<script>
const SHED=[{name:'Non-critical office load',kw:120,priority:3},{name:'Test lab',kw:80,priority:2},{name:'CRAC unit B (redundant)',kw:150,priority:2}];
function run(){
  let load=+document.getElementById('load').value;
  const ups=+document.getElementById('ups').value, rt=+document.getElementById('runtime').value,
    gen=+document.getElementById('gen').value, gs=+document.getElementById('gstart').value,
    ats=+document.getElementById('ats').value, restore=+document.getElementById('restore').value;
  const shed=[...SHED].sort((a,b)=>b.priority-a.priority);
  const rows=[]; let gaps=0, maxShort=0, soc=1, shedLog=[];
  for(let t=0;t<=restore+10;t++){
    let cap,src;
    if(t<restore){
      if(t<gs+5){cap=ups;src='UPS battery';}
      else if(t<gs+5+ats){cap=Math.min(ups,gen*(t-gs)/5);src='Generator ramping';}
      else{cap=gen;src='Generator';}
    } else {cap=1e9;src='Mains restored';}
    if(src==='UPS battery') soc-=(load/ups)/rt;
    while(load>cap&&shed.length){const s=shed.shift();load-=s.kw;shedLog.push(s.name+' ('+s.kw+' kW) @ t='+t+'s');}
    const short=load-cap;
    if(short>0){gaps++;maxShort=Math.max(maxShort,short);}
    rows.push({t,load,cap:Math.min(cap,1200),src,short:Math.max(0,short)});
    if(t===0||t===gs||t===gs+5||t===gs+5+ats||t===restore)
      rows[rows.length-1].note=src+': load '+load+' kW vs capacity '+(cap>1e8?'mains':Math.round(cap)+' kW')+', UPS SoC '+Math.max(0,soc*100).toFixed(0)+'%';
    if(soc<=0&&src==='UPS battery'){rows.push({t,note:'UPS BATTERY EXHAUSTED — OUTAGE'});break;}
  }
  document.getElementById('verdict').innerHTML=gaps===0
    ?'<div class="ok" style="padding:10px;border-radius:6px"><b>✓ No gap.</b> Load never exceeded available capacity. Final load '+load+' kW.</div>'
    :'<div class="gap" style="padding:10px;border-radius:6px"><b>⚠ WHAT BREAKS:</b> load exceeded capacity for <b>'+gaps+' s</b>, max shortfall <b>'+maxShort.toFixed(0)+' kW</b>. Shed: '+(shedLog.join('; ')||'nothing left to shed!')+'</div>';
  let html='<table><tr><th>t (s)</th><th>Source</th><th>Load (kW)</th><th>Capacity (kW)</th><th>Note</th></tr>';
  rows.filter(r=>r.note).forEach(r=>{html+='<tr class="'+(r.short>0?'gap':'')+'"><td>'+r.t+'</td><td>'+r.src+'</td><td>'+r.load+'</td><td>'+(r.cap>1e8?'mains':Math.round(r.cap))+'</td><td>'+(r.note||'')+'</td></tr>';});
  document.getElementById('timeline').innerHTML=html+'</table>';
  const c=document.getElementById('chart'),ctx=c.getContext('2d');
  ctx.clearRect(0,0,c.width,c.height);
  const maxV=1200, X=t=>20+t/(restore+10)*(c.width-40), Y=v=>190-v/maxV*170;
  ctx.strokeStyle='#0f766e';ctx.lineWidth=2;ctx.beginPath();
  rows.forEach((r,i)=>{i?ctx.lineTo(X(r.t),Y(r.cap)):ctx.moveTo(X(r.t),Y(r.cap));});ctx.stroke();
  ctx.strokeStyle='#dc2626';ctx.beginPath();
  rows.forEach((r,i)=>{i?ctx.lineTo(X(r.t),Y(r.load)):ctx.moveTo(X(r.t),Y(r.load));});ctx.stroke();
  ctx.fillStyle='#0f766e';ctx.fillText('— capacity',20,14);ctx.fillStyle='#dc2626';ctx.fillText('— load',110,14);
  ctx.fillStyle='#64748b';ctx.fillText('t=0 mains fail',X(0)+4,30);ctx.fillText('gen start t='+gs+'s',X(gs),60);
}
run();
</script></body></html>

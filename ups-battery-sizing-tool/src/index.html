<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UPS &amp; Battery Backup Sizing Tool</title><link rel="stylesheet" href="styles.css"></head><body>
<header><h1>UPS &amp; Battery Backup Sizing Tool</h1><p>UPS rating and battery bank sizing — with honest ageing and temperature derating.</p></header>
<main>
<section class="card"><h2>Critical load</h2>
<label>Critical load (kVA)<input id="kva" type="number" value="20" step="1"></label>
<label>Power factor<input id="pf" type="number" value="0.9" step="0.01"></label>
<label>Autonomy required (minutes)<input id="aut" type="number" value="30" step="5"></label>
<label>DC bus voltage (V)<input id="dc" type="number" value="480"></label>
<label>Battery type <select id="bat"><option>VRLA</option><option>Li-ion</option></select></label>
<label>Ambient temperature <select id="tmp"><option value="1.0">25&deg;C (no derating)</option><option value="1.11" selected>20&deg;C (x1.11)</option><option value="1.25">15&deg;C (x1.25)</option></select></label>
<button onclick="calc()">Size UPS &amp; battery</button></section>
<section class="card"><h2>Result</h2><div id="out"></div></section>
<section class="card"><h2>Runtime curve</h2><canvas id="chart" height="180"></canvas><p class="mut">Backup time vs load (for the sized battery bank).</p></section>
<section class="card"><h2>VRLA vs Li-ion</h2><div id="cmp"></div></section>
</main><script src="app.js"></script></body></html>

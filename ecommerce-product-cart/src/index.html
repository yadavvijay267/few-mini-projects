<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clamor Store — Products & Cart</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar"><h1>Clamor Store</h1>
  <div class="controls">
    <input id="search" type="search" placeholder="Search products..." aria-label="Search products">
    <select id="category" aria-label="Filter by category"><option value="">All categories</option></select>
    <select id="sort" aria-label="Sort products"><option value="featured">Featured</option><option value="price-asc">Price: low to high</option><option value="price-desc">Price: high to low</option><option value="rating">Top rated</option></select>
    <button id="cartBtn" class="btn primary">Cart (<span id="cartCount">0</span>)</button>
  </div>
</header>
<p id="apiNote" class="note"></p>
<main>
  <section id="grid" class="grid" aria-label="Products"></section>
  <section class="recent"><h2>Recently viewed</h2><div id="recentRail" class="rail"></div></section>
</main>
<aside id="cartDrawer" class="drawer hidden" aria-label="Shopping cart">
  <h2>Your cart</h2>
  <div id="cartItems"></div>
  <div class="promo"><input id="promoCode" placeholder="Promo code (try WELCOME10)"><button id="applyPromo" class="btn">Apply</button></div>
  <p id="promoMsg"></p>
  <div id="totals" class="totals"></div>
  <button id="checkoutBtn" class="btn primary wide">Checkout</button>
  <button id="closeCart" class="btn wide">Continue shopping</button>
</aside>
<div id="detail" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modal-card" id="detailCard"></div>
</div>
<div id="checkout" class="modal hidden" role="dialog" aria-modal="true">
  <form id="checkoutForm" class="modal-card">
    <h2>Checkout summary</h2>
    <div id="checkoutSummary"></div>
    <label>Full name <input name="name" required></label>
    <label>Email <input name="email" type="email" required></label>
    <label>Address <input name="address" required></label>
    <label>City <input name="city" required></label>
    <p id="formError" class="error"></p>
    <div class="modal-actions"><button class="btn primary" type="submit">Place order</button><button type="button" id="cancelCheckout" class="btn">Cancel</button></div>
  </form>
</div>
<script src="app.js"></script>
</body>
</html>

openapi: 3.0.3
info:
  title: Task Manager API
  version: 1.0.0
  description: REST API for tasks with JWT auth, filtering, sorting and pagination.
servers:
  - url: http://localhost:3001
paths:
  /health:
    get:
      summary: Health check
      responses: { "200": { description: OK } }
  /api/auth/register:
    post:
      summary: Register a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses: { "201": { description: Created with JWT }, "409": { description: Email taken } }
  /api/auth/login:
    post:
      summary: Log in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses: { "200": { description: OK with JWT }, "401": { description: Bad credentials } }
  /api/tasks:
    get:
      summary: List tasks (filters, sort, pagination)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [todo, in-progress, done] } }
        - { name: priority, in: query, schema: { type: string, enum: [low, medium, high] } }
        - { name: search, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 10 } }
      responses: { "200": { description: Paginated task list }, "401": { description: Unauthorized } }
    post:
      summary: Create a task
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                description: { type: string }
                status: { type: string, enum: [todo, in-progress, done] }
                priority: { type: string, enum: [low, medium, high] }
                dueDate: { type: string, format: date }
                tags: { type: array, items: { type: string } }
      responses: { "201": { description: Created }, "422": { description: Validation failed } }
  /api/tasks/{id}:
    get:
      summary: Get one task
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK }, "404": { description: Not found } }
    put:
      summary: Update a task
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK }, "422": { description: Validation failed } }
    delete:
      summary: Delete a task
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: Deleted } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

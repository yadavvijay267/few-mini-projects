<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<title>Capacity Forecasting Tool</title>
<style>body{font-family:system-ui,sans-serif;max-width:960px;margin:0 auto;padding:20px;background:#f8fafc;color:#0f172a}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:16px;margin:14px 0}
label{display:block;font-size:13px;margin:8px 0 2px}input[type=range]{width:300px}
button{background:#7c3aed;color:#fff;border:0;border-radius:6px;padding:10px 18px;cursor:pointer}
.big{font-size:22px;font-weight:700;color:#6d28d9}
canvas{width:100%;height:240px}
table{border-collapse:collapse;width:100%}td,th{border:1px solid #e2e8f0;padding:6px;text-align:left;font-size:14px}</style></head>
<body><h1>📈 Capacity Forecasting Tool</h1>
<p>When do we run out of power, space or cooling? Linear regression on 18 months of history — answered as a date.</p>
<div class="card"><h3>Scenario — growth multiplier</h3>
<label>Power growth: <b id="gpv">1.0×</b></label><input type="range" id="gp" min="0.5" max="2" step="0.1" value="1" oninput="render()">
<label>Rack growth: <b id="grv">1.0×</b></label><input type="range" id="gr" min="0.5" max="2" step="0.1" value="1" oninput="render()">
<label>Cooling growth: <b id="gcv">1.0×</b></label><input type="range" id="gc" min="0.5" max="2" step="0.1" value="1" oninput="render()">
</div>
<div class="card" id="summary"></div>
<div class="card"><h3>Power forecast (kW) — history, fit, confidence band</h3><canvas id="chart" width="880" height="240"></canvas></div>
<div class="card"><button onclick="window.print()">🖨 Print executive summary</button></div>
<script>
const MONTHS=['2025-01','2025-02','2025-03','2025-04','2025-05','2025-06','2025-07','2025-08','2025-09','2025-10','2025-11','2025-12','2026-01','2026-02','2026-03','2026-04','2026-05','2026-06'];
const POWER=[420,438,455,470,492,510,528,545,562,580,598,615,632,650,668,685,702,720];
const RACKS=[18,19,20,20,21,22,23,23,24,25,25,26,27,27,28,29,29,30];
const COOL=[380,395,410,425,445,460,478,492,508,525,540,556,572,588,604,620,636,652];
const CAP={power:1000,racks:40,cooling:900};
function ols(ys){const n=ys.length,mx=(n-1)/2,my=ys.reduce((a,b)=>a+b,0)/n;
  let sxx=0,sxy=0;ys.forEach((y,i)=>{sxx+=(i-mx)**2;sxy+=(i-mx)*(y-my);});
  const b=sxy/sxx,a=my-b*mx;
  const ssr=ys.reduce((s,y,i)=>s+(y-(a+b*i))**2,0),sst=ys.reduce((s,y)=>s+(y-my)**2,0);
  return {a,b,r2:1-ssr/sst,sig:Math.sqrt(ssr/Math.max(n-2,1))};}
function runOut(ys,cap,g){const f=ols(ys),slope=f.b*g;
  if(slope<=0)return null; const t=(cap-f.a)/slope, ahead=t-(ys.length-1);
  if(ahead<0)return 'already over capacity';
  const base=new Date(2026,5,1); base.setMonth(base.getMonth()+Math.ceil(ahead));
  return base.toLocaleDateString('en-GB',{month:'long',year:'numeric'})+' ('+ahead.toFixed(1)+' mo)';}
function render(){
  const gp=+document.getElementById('gp').value,gr=+document.getElementById('gr').value,gc=+document.getElementById('gc').value;
  document.getElementById('gpv').textContent=gp.toFixed(1)+'×';document.getElementById('grv').textContent=gr.toFixed(1)+'×';document.getElementById('gcv').textContent=gc.toFixed(1)+'×';
  const fp=ols(POWER),fr=ols(RACKS),fc=ols(COOL);
  document.getElementById('summary').innerHTML='<h3>Executive summary</h3><table>'+
   '<tr><th>Resource</th><th>Now</th><th>Growth</th><th>R²</th><th>Capacity</th><th>Run-out date</th></tr>'+
   '<tr><td>Power</td><td>720 kW</td><td>'+(fp.b*gp).toFixed(1)+' kW/mo</td><td>'+fp.r2.toFixed(3)+'</td><td>1000 kW</td><td class="big">'+runOut(POWER,1000,gp)+'</td></tr>'+
   '<tr><td>Racks</td><td>30</td><td>'+(fr.b*gr).toFixed(2)+' /mo</td><td>'+fr.r2.toFixed(3)+'</td><td>40</td><td class="big">'+runOut(RACKS,40,gr)+'</td></tr>'+
   '<tr><td>Cooling</td><td>652 kW</td><td>'+(fc.b*gc).toFixed(1)+' kW/mo</td><td>'+fc.r2.toFixed(3)+'</td><td>900 kW</td><td class="big">'+runOut(COOL,900,gc)+'</td></tr></table>'+
   '<p style="color:#64748b">Method: ordinary least squares on monthly utilisation; run-out = where the fitted line crosses capacity. Move a slider to see the date move.</p>';
  const c=document.getElementById('chart'),ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);
  const maxV=1050,Y=v=>220-v/maxV*200,X=i=>20+i/29*(c.width-40);
  ctx.strokeStyle='#dc2626';ctx.setLineDash([6,4]);ctx.beginPath();ctx.moveTo(0,Y(1000));ctx.lineTo(c.width,Y(1000));ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='#dc2626';ctx.fillText('Capacity 1000 kW',8,Y(1000)-6);
  // confidence band
  ctx.fillStyle='rgba(124,58,237,0.12)';ctx.beginPath();
  for(let i=0;i<=29;i++){const y=fp.a+fp.b*i+1.96*fp.sig;i?ctx.lineTo(X(i),Y(y)):ctx.moveTo(X(i),Y(y));}
  for(let i=29;i>=0;i--){ctx.lineTo(X(i),Y(fp.a+fp.b*i-1.96*fp.sig));}
  ctx.closePath();ctx.fill();
  ctx.strokeStyle='#7c3aed';ctx.lineWidth=2;ctx.beginPath();
  for(let i=0;i<=29;i++){i?ctx.lineTo(X(i),Y(fp.a+fp.b*i)):ctx.moveTo(X(i),Y(fp.a+fp.b*i));}ctx.stroke();
  ctx.fillStyle='#0f172a';POWER.forEach((v,i)=>{ctx.beginPath();ctx.arc(X(i),Y(v),4,0,7);ctx.fill();});
  ctx.fillStyle='#7c3aed';ctx.fillText('— forecast + 95% band',20,16);ctx.fillStyle='#0f172a';ctx.fillText('● actual',180,16);
}
render();
</script></body></html>
